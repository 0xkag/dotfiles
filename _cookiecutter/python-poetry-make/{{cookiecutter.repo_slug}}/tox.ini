[tox]
isolated_build = True
envlist = py312,py313,py314

[testenv]
allowlist_externals = make*
# make develop installs the versions pinned in poetry.lock; tox's own pip
# install of the package's dependencies would ignore the lock
skip_install = true
passenv =
    AWS_SHARED_CREDENTIALS_FILE
    HOME
    REQUESTS_CA_BUNDLE
    USER
commands =
# a properly setup dev environment doesn't seem to require poetry/pipx/plugin
# install again
    make develop
    make test
