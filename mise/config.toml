[settings]
auto_install = false
experimental = false
gitlab.use_git_credentials = true
locked = true
lockfile = true
minimum_release_age = "7d"
paranoid = true

[tools]
# libc = "musl": on glibc hosts mise prefers glibc builds, and some need a
# newer glibc than Amazon Linux 2's 2.26 (yazi's needs 2.39).
ag = "2.2.0"
awscli = { version = "2.37.4", symlink_bins = "true" }
cmake = "4.4.3"
codex = { version = "0.125.0", libc = "musl" }
fd = { version = "10.5.0", libc = "musl" }
fzf = "0.74.4"
glow = "2.1.2"
hurl = "8.0.1"
maven = "3.9.16"
neovim = { version = "0.12.5", os = ["linux", "macos", "windows"] }
ninja = "1.13.2"
ollama = "0.34.4"
pandoc = "3.11"
perl = "5.44.0"
pre-commit = "4.6.2"
ripgrep = "15.1.0"
ruff = "0.16.9"
rust = "latest"
shellcheck = "0.11.0"
terraform = "1.13.2"
tflint = "0.64.0"
tree-sitter = "0.27.0"
#terraform-docs = "system"
#terraformer = "system"
#terragrunt = "system"
#tflint = "system"
#tfupdate = "system"
vim = "9.2.1135"
yamllint = "1.38.0"
yazi = { version = "26.9.1", libc = "musl" }
